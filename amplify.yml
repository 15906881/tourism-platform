version: 1
applications:
  - appRoot: apps/tenant-dashboard
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 20.19.5 || true
            - nvm use 20.19.5 || true
            - corepack enable
            - pnpm install --frozen-lockfile
        build:
          commands:
            - pnpm --filter @weblynk/tokens build
            - pnpm --filter @weblynk/ui build
            - pnpm --filter @weblynk/blocks build
            - pnpm --filter @weblynk/templates build
            - pnpm --filter @weblynk/server build
            - pnpm --filter tenant-dashboard build
      artifacts:
        baseDirectory: apps/tenant-dashboard/.next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .pnpm-store/**/*
