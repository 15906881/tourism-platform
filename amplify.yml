version: 1
applications:
  - appRoot: apps/site-renderer
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm install 20 || true
            - nvm use 20 || true
            - npm install -g pnpm
            - pnpm install --frozen-lockfile
        build:
          commands:
            # shared pkgs first (optional, but you do this everywhere)
            - pnpm --filter @weblynk/tokens build
            - pnpm --filter @weblynk/ui build
            - pnpm --filter @weblynk/blocks build
            - pnpm --filter @weblynk/templates build
            # now the actual site
            - pnpm --filter site-renderer build
      artifacts:
        # 👈 important: we are already inside apps/site-renderer
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .pnpm-store/**/*
