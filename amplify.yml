version: 1
applications:
  - appRoot: apps/site-renderer
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm install 20 || true
            - nvm use 20 || true
            - npm install -g pnpm
            - pnpm install --frozen-lockfile
        build:
          commands:
            - pnpm --filter @weblynk/tokens build
            - pnpm --filter @weblynk/ui build
            - pnpm --filter @weblynk/blocks build
            - pnpm --filter @weblynk/templates build
            - |
              echo "Building app at: ${AMPLIFY_MONOREPO_APP_ROOT}"
              cd ${AMPLIFY_MONOREPO_APP_ROOT}
              pnpm build
              cd -
      artifacts:
        baseDirectory: apps/site-renderer/.next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .pnpm-store/**/*
