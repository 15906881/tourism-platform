version: 1
applications:
  - appRoot: apps/tenant-dashboard
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm install 20 || true
            - nvm use 20 || true
            - npm install -g pnpm
            - pnpm install --frozen-lockfile
        build:
          commands:
            - pnpm --filter @weblynk/tokens build
            - pnpm --filter @weblynk/ui build
            - pnpm --filter @weblynk/blocks build
            - pnpm --filter @weblynk/templates build
            - pnpm --filter tenant-dashboard build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .pnpm-store/**/*
