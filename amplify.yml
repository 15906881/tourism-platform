version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20.19.5 || true
        - nvm use 20.19.5 || true
        - corepack enable
        - pnpm install --frozen-lockfile
    build:
      commands:
        - pnpm --filter @weblynk/tokens build
        - pnpm --filter @weblynk/ui build
        - pnpm --filter @weblynk/blocks build
        - pnpm --filter @weblynk/templates build
        - pnpm --filter site-renderer build
  artifacts:
    baseDirectory: apps/site-renderer/out
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .pnpm-store/**/*

    # Create deploy-manifest.json for Amplify WEB_COMPUTE
    - |
      echo "Creating deploy-manifest.json for Amplify..."
      cd apps/tenant-dashboard
      cat > .next/deploy-manifest.json << 'MANIFEST'
      {
        "version": 1,
        "routes": [
          {
            "path": "/*",
            "mode": "SSR"
          }
        ],
        "staticFiles": [
          ".next/static/**"
        ]
      }
      MANIFEST
      echo "deploy-manifest.json created successfully"
