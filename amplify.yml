version: 1
applications:
  - appRoot: apps/site-renderer
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 20.19.5
            - nvm use 20.19.5
            - corepack enable
            - cd ../.. && pnpm install --frozen-lockfile && cd apps/site-renderer
        build:
          commands:
            - cd ../..
            - pnpm --filter @weblynk/tokens build
            - pnpm --filter @weblynk/ui build
            - pnpm --filter @weblynk/blocks build
            - pnpm --filter @weblynk/templates build
            - pnpm --filter site-renderer build
            - cd apps/site-renderer
      artifacts:
        baseDirectory: .
        files:
          - '.next/**/*'
          - 'node_modules/**/*'
          - 'package.json'
          - 'next.config.js'
          - 'public/**/*'
      cache:
        paths:
          - ../../node_modules/**/*
          - ../../.pnpm-store/**/*
