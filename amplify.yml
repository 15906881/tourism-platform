version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20.19.5 || true
        - nvm use 20.19.5 || true
        - corepack enable
        - pnpm install --frozen-lockfile
    build:
      commands:
        - pnpm --filter tenant-dashboard build
  artifacts:
    baseDirectory: apps/tenant-dashboard/.next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .pnpm-store/**/*
