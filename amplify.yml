version: 1
frontend:
  phases:
    preBuild:
      commands:
        - corepack enable
        - pnpm install --frozen-lockfile
    build:
      commands:
        - pnpm -F site-renderer build
  artifacts:
    baseDirectory: apps/site-renderer/.next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - apps/site-renderer/.next/cache/**/*
