version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20 || true
        - nvm use 20 || true
        - node -v
        - corepack enable
        - corepack prepare pnpm@9 --activate
        - pnpm -v
        - pnpm install --frozen-lockfile --prod=false
    build:
      commands:
        # Build with dependency graph so packages (e.g., @weblynk/ui) compile first
        - pnpm -r --filter '...site-renderer' --if-present build
        # If you deploy other apps via Amplify, add them too:
        # - pnpm -r --filter '...admin' --if-present build
        # - pnpm -r --filter '...tenant-dashboard' --if-present build
  artifacts:
    baseDirectory: apps/site-renderer/.next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - apps/**/.next/cache/**/*
      - packages/**/dist/**/*
