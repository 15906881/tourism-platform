version: 1
frontend:
  phases:
    preBuild:
      commands:
        - corepack enable
        - corepack prepare pnpm@latest --activate
        - pnpm -v
        - node -v
        - pnpm install --frozen-lockfile
    build:
      commands:
        - pnpm --filter admin build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
  appRoot: apps/admin
