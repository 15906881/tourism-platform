version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20.19.5 || true
        - nvm use 20.19.5 || true
        - corepack enable
        - cd ../.. && pnpm install --frozen-lockfile && cd apps/admin
    build:
      commands:
        - cd ../..
        - pnpm --filter @weblynk/tokens build
        - pnpm --filter @weblynk/ui build
        - pnpm --filter admin build
  artifacts:
    baseDirectory: out
    files:
      - '**/*'
  cache:
    paths:
      - ../../node_modules/**/*
      - ../../.pnpm-store/**/*
