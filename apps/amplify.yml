version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - nvm use 20
        - corepack enable
        - corepack prepare pnpm@9.12.0 --activate
        # COMPLETELY clear all caches
        - rm -rf node_modules */*/node_modules */.next
        - pnpm install --frozen-lockfile
    build:
      commands:
        - cd apps/site-renderer && pnpm build
  artifacts:
    baseDirectory: apps/site-renderer
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - apps/site-renderer/.next/cache/**/*
