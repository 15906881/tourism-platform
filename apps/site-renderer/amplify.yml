version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20.19.5 || true
        - nvm use 20.19.5 || true
        - corepack enable
        - pnpm install --frozen-lockfile --prod=false
    build:
      commands:
        - pnpm --filter @weblynk/tokens build
        - pnpm --filter @weblynk/ui build
        - pnpm --filter @weblynk/blocks build
        - pnpm --filter @weblynk/templates build
        - pnpm --filter site-renderer build
        - cp -r apps/site-renderer/.next/standalone/. apps/site-renderer/.next/deploy
        - cp -r apps/site-renderer/.next/static apps/site-renderer/.next/deploy/apps/site-renderer/.next/static
        - cp -r apps/site-renderer/public apps/site-renderer/.next/deploy/apps/site-renderer/public
  artifacts:
    baseDirectory: apps/site-renderer/.next/deploy
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .pnpm-store/**/*
      - apps/site-renderer/.next/cache/**/*
      - packages/**/dist/**/*
