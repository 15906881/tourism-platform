version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - nvm use 20
        - corepack enable
        - corepack prepare pnpm@9.12.0 --activate
        # Clear cache and install
        - rm -rf node_modules */*/node_modules */.next
        - pnpm install --frozen-lockfile
        # Build tokens package first
        - pnpm --filter @weblynk/tokens build
    build:
      commands:
        - pnpm --filter site-renderer build
  artifacts:
    baseDirectory: apps/site-renderer
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - apps/site-renderer/.next/cache/**/*
