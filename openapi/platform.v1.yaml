## 💡 Pro Tips

### For Backend Devs
- **Use the spec as source of truth** - don't hand-code routes
- **Validate requests** against OpenAPI schemas (ajv, joi)
- **Generate API docs** automatically from spec (no drift)
- **Contract testing** ensures BFF matches OpenAPI spec

### For Frontend Devs
- **Generate typed client** from spec (TypeScript safety)
- **Use examples** for mock data in Storybook
- **Implement retry logic** with exponential backoff + Idempotency-Key
- **Show rate limit info** in dev tools for debugging

### For QA
- **Import OpenAPI spec** into Postman for testing
- **Test all error codes** (not just happy path)
- **Verify rate limiting** doesn't break legitimate usage
- **Test edge cases** from schema constraints (maxLength, pattern)

---

## 📊 API Metrics to Track

Once implemented, monitor:
- **Request rate** by endpoint (identify hot paths)
- **Error rate** by code (422 = validation issues, 403 = permission bugs)
- **P95 latency** (should be < 200ms for most endpoints)
- **Rate limit hits** (429s = need to increase limits or optimize clients)
- **Idempotency cache hit rate** (retries vs unique requests)

---

## 🔒 Security Checklist

Before going live:
- [ ] JWT validation enforces `aud` and `iss`
- [ ] Rate limiting per tenant/user (not just global)
- [ ] Captcha validation on anonymous lead submissions
- [ ] File upload size/type validation (prevent DOS)
- [ ] SQL injection protection (parameterized queries)
- [ ] CORS properly configured (whitelist origins)
- [ ] HTTPS enforced (redirect HTTP → HTTPS)
- [ ] Sensitive data not in logs (PII, tokens)
- [ ] Error messages don't leak internal details

