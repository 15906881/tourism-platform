# OpenAPI v1.0 - Production Refinements Applied

## ✅ All Refinements Implemented

### 1. Standard Headers (Rate Limiting & Tracing)

**Added header components:**
- `X-Request-Id` - Trace ID for request tracking
- `RateLimit-Limit` - Max requests per window
- `RateLimit-Remaining` - Remaining requests
- `RateLimit-Reset` - Seconds until reset
- `Idempotency-Key` - Echo of submitted key

**Applied to:**
- All GET responses (list endpoints)
- All POST/PUT/PATCH responses
- 429 Rate Limit response

---

### 2. Better HTTP Status Codes

**Added `422 Unprocessable Entity`:**
- For validation failures on semantically correct requests
- Example: slug not unique, invalid module_payload structure
- Distinct from `400 Bad Request` (malformed JSON, missing required fields)

**Usage:**
- POST/PUT/PATCH operations with body validation
- Clear error details with field name and reason

---

### 3. Bot Abuse Protection

**Added to `LeadInput` schema:**
```yaml
captcha_token:
  type: string
  description: Anti-bot token (e.g., reCAPTCHA v3, Cloudflare Turnstile)
```

**Implementation notes:**
- Required for anonymous lead submissions
- Optional for authenticated users (lower abuse risk)
- Server validates token with provider before accepting lead

---

### 4. Advanced Filtering on List Endpoints

**Listings (`GET /tenants/{tenantId}/listings`):**
- `module` - Filter by vertical (hotel, salon, tour, restaurant)
- `updated_after` - Filter by update timestamp (datetime)
- `updated_before` - Filter by update timestamp (datetime)

**Leads (`GET /tenants/{tenantId}/leads`):**
- `created_after` - Filter by creation timestamp
- `created_before` - Filter by creation timestamp

**Benefits:**
- Dashboard date range filtering
- "Show me changes this week" queries
- Vertical-specific views

---

### 5. Media Upload Error Handling

**Added explicit responses:**
- `413 Payload Too Large` - File exceeds size limit (e.g., 10MB)
- `415 Unsupported Media Type` - Wrong file type (only JPEG/PNG/WebP allowed)

**Error details include:**
- `max_size_mb` for 413
- `allowed_types` array for 415

---

### 6. Response Examples & Consistency

**Added `examples` section with:**
- `ListingExample` - Full hotel listing with module_payload
- `LeadExample` - New web lead with contact info

**Applied to:**
- POST /listings 201 response
- GET /listings 200 response  
- GET /leads 200 response (with pagination example)

**Benefits:**
- Frontend developers see exact response shapes
- Reduces integration guesswork
- Auto-generates SDK mock data

---

### 7. Member Ownership Enforcement

**Updated PATCH /listings documentation:**
- Summary explicitly states: "members can only edit own listings via created_by check"
- Added specific 403 error example:
  ```json
  {
    "error": "Insufficient permissions",
    "code": "FORBIDDEN",
    "details": {
      "reason": "member_cannot_edit_others_listing"
    }
  }
  ```

**Implementation guidance:**
- Backend checks `listing.created_by === jwt.sub` for member role
- Clear error message for debugging

---

### 8. Webhooks (Future-Proof)

**Added `x-webhooks` section:**
- `lead.created` - Triggered when new lead submitted
- `listing.published` - Triggered when listing goes live

**Webhook payload structure:**
```json
{
  "event": "lead.created",
  "timestamp": "2025-09-28T23:35:00Z",
  "data": { /* full Lead object */ }
}
```

**Benefits:**
- Documents future event system
- Tenants can subscribe to events (Phase 7+)
- Integration with Zapier, Make, etc.

---

### 9. Additional Improvements

**Cursor-based pagination support:**
- Added optional `next_cursor` field to `PaginatedResponse`
- Allows future migration from offset to cursor pagination
- Better performance for large datasets

**Better validation:**
- `ListingInput.slug` pattern validation documented
- `LeadInput.payload_json.message` max length (2000 chars)
- Email format validation

**Response headers on all endpoints:**
- Consistent rate limiting info
- Request tracing with X-Request-Id
- Idempotency confirmation on mutations

