name: Docker Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apps:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [tenant-dashboard, site-renderer, admin]
    
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm via Corepack
  run: |
    corepack enable
    corepack install
    pnpm -v
