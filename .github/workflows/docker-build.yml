name: Build Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [admin, tenant-dashboard, site-renderer]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @weblynk/tokens build
          pnpm --filter @weblynk/db build
          pnpm --filter @weblynk/auth build
          pnpm --filter @weblynk/server build
          pnpm --filter @weblynk/ui build
          pnpm --filter @weblynk/blocks build
          pnpm --filter @weblynk/templates build

      - name: Build app
        run: pnpm --filter ${{ matrix.app }} build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          tags: tourism/${{ matrix.app }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
