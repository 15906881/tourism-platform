name: Docker Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apps:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [tenant-dashboard, site-renderer, admin]
    
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Build ${{ matrix.app }}
        run: pnpm -C apps/${{ matrix.app }} build
