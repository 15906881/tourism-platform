name: Deploy monorepo apps to Vercel

on:
  push:
    branches:
      - pristine.04
  workflow_dispatch: {}

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  admin:
    name: Deploy admin (CRAN team)
    runs-on: ubuntu-latest
    env:
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.0  # Fixed to match package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps (root)
        run: pnpm install --no-frozen-lockfile

      - name: Build admin with turbo
        run: pnpm turbo run build --filter=admin

      - name: Create .vercel directory and config
        working-directory: apps/admin
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<'JSON'
          {
            "projectId": "${{ env.VERCEL_PROJECT_ID }}",
            "orgId": "${{ env.VERCEL_ORG_ID }}"
          }
          JSON

      # 🔴 THIS was missing - creates .vercel/output for prebuilt deployment
      - name: Vercel local build (produce .vercel/output)
        working-directory: apps/admin
        run: npx vercel@latest build --prod --yes --token "${{ env.VERCEL_TOKEN }}"

      - name: Deploy to Vercel (prebuilt)
        working-directory: apps/admin
        run: npx vercel@latest deploy --prebuilt --prod --yes --token "${{ env.VERCEL_TOKEN }}"

  tenant:
    name: Deploy tenant (CRAN team)
    runs-on: ubuntu-latest
    needs: admin
    env:
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_TENANT }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.0  # Fixed to match package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      - name: Build tenant only
        run: pnpm turbo run build --filter=apps/tenant-dashboard --filter=tenant-dashboard --filter=tenant

      - name: Create .vercel config
        working-directory: apps/tenant-dashboard
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<'JSON'
          {
            "orgId": "${{ env.VERCEL_ORG_ID }}",
            "projectId": "${{ env.VERCEL_PROJECT_ID }}"
          }
          JSON

      # 🔴 THIS was missing - creates .vercel/output for prebuilt deployment
      - name: Vercel local build (produce .vercel/output)
        working-directory: apps/tenant-dashboard
        run: npx vercel@latest build --prod --yes --token "${{ env.VERCEL_TOKEN }}"

      - name: Deploy to Vercel (prebuilt)
        working-directory: apps/tenant-dashboard
        run: npx vercel@latest deploy --prebuilt --prod --yes --token "${{ env.VERCEL_TOKEN }}"
