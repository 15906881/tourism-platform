name: Build & Deploy to Vercel (monorepo)

on:
  push:
    branches:
      - pristine.04
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app:
          - name: admin
            filter: admin
          - name: tenant-dashboard  
            filter: tenant-dashboard
          - name: site-renderer
            filter: site-renderer

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID_ADMIN: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}
      VERCEL_PROJECT_ID_TENANT: ${{ secrets.VERCEL_PROJECT_ID_TENANT }}
      VERCEL_PROJECT_ID_SITE: ${{ secrets.VERCEL_PROJECT_ID_SITE }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Enable corepack
        run: corepack enable

      - name: Use pnpm 9.12.0
        run: corepack prepare pnpm@9.12.0 --activate

      - name: Install deps (monorepo)
        run: pnpm install

      - name: Build app
        run: |
          echo "➡️ Building ${{ matrix.app.name }}"
          pnpm --filter "${{ matrix.app.filter }}..." build

      - name: Deploy prebuilt to Vercel
        run: |
          if [ "${{ matrix.app.name }}" = "admin" ]; then
            PROJECT_ID="$VERCEL_PROJECT_ID_ADMIN"
          elif [ "${{ matrix.app.name }}" = "tenant-dashboard" ]; then
            PROJECT_ID="$VERCEL_PROJECT_ID_TENANT"
          else
            PROJECT_ID="$VERCEL_PROJECT_ID_SITE"
          fi

          echo "➡️ Deploying ${{ matrix.app.name }} with project ID: $PROJECT_ID"
          npx vercel@latest deploy \
            --prebuilt \
            --token "$VERCEL_TOKEN" \
            --scope "$VERCEL_ORG_ID" \
            --project "$PROJECT_ID" \
            --prod
