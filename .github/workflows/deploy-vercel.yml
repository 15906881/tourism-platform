name: Deploy monorepo apps to Vercel

on:
  push:
    branches:
      - pristine.04
  workflow_dispatch: {}

env:
  # shared
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  admin:
    name: Deploy admin
    runs-on: ubuntu-latest
    env:
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Enable corepack + pin pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm -v

      - name: Install deps (root)
        run: pnpm install --no-frozen-lockfile

      - name: Create .vercel/project.json for admin
        run: |
          mkdir -p apps/admin/.vercel
          cat > apps/admin/.vercel/project.json <<'JSON'
          {
            "projectId": "${{ env.VERCEL_PROJECT_ID }}",
            "orgId": "${{ env.VERCEL_ORG_ID }}"
          }
          JSON

      - name: Vercel build (admin)
        run: npx vercel@latest build --prod --yes --token "${{ env.VERCEL_TOKEN }}" --cwd apps/admin

      - name: Vercel deploy (admin, prebuilt)
        run: npx vercel@latest deploy --prebuilt --prod --yes --token "${{ env.VERCEL_TOKEN }}" --cwd apps/admin

  tenant:
    name: Deploy tenant-dashboard
    runs-on: ubuntu-latest
    needs: admin
    env:
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_TENANT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Enable corepack + pin pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm -v

      - name: Install deps (root)
        run: pnpm install --no-frozen-lockfile

      - name: Create .vercel/project.json for tenant-dashboard
        run: |
          mkdir -p apps/tenant-dashboard/.vercel
          cat > apps/tenant-dashboard/.vercel/project.json <<'JSON'
          {
            "projectId": "${{ env.VERCEL_PROJECT_ID }}",
            "orgId": "${{ env.VERCEL_ORG_ID }}"
          }
          JSON

      - name: Vercel build (tenant-dashboard)
        run: npx vercel@latest build --prod --yes --token "${{ env.VERCEL_TOKEN }}" --cwd apps/tenant-dashboard

      - name: Vercel deploy (tenant-dashboard, prebuilt)
        run: npx vercel@latest deploy --prebuilt --prod --yes --token "${{ env.VERCEL_TOKEN }}" --cwd apps/tenant-dashboard

  site:
    name: Deploy site-renderer
    runs-on: ubuntu-latest
    needs: tenant
    env:
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_SITE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Enable corepack + pin pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm -v

      - name: Install deps (root)
        run: pnpm install --no-frozen-lockfile

      - name: Create .vercel/project.json for site-renderer
        run: |
          mkdir -p apps/site-renderer/.vercel
          cat > apps/site-renderer/.vercel/project.json <<'JSON'
          {
            "projectId": "${{ env.VERCEL_PROJECT_ID }}",
            "orgId": "${{ env.VERCEL_ORG_ID }}"
          }
          JSON

      - name: Vercel build (site-renderer)
        run: npx vercel@latest build --prod --yes --token "${{ env.VERCEL_TOKEN }}" --cwd apps/site-renderer

      - name: Vercel deploy (site-renderer, prebuilt)
        run: npx vercel@latest deploy --prebuilt --prod --yes --token "${{ env.VERCEL_TOKEN }}" --cwd apps/site-renderer
