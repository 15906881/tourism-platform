name: Deploy monorepo apps to Vercel

on:
  push:
    branches:
      - pristine.04
  workflow_dispatch: {}

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  admin:
    name: Deploy admin
    runs-on: ubuntu-latest
    env:
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}
    steps:
      - uses: actions/checkout@v4

      # 1) Setup pnpm FIRST (before Node with pnpm cache)
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.0

      # 2) Then setup Node with pnpm cache (now pnpm exists)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # 3) Install workspace deps
      - name: Install deps (root)
        run: pnpm install --no-frozen-lockfile

      # 4) Create per-app vercel config
      - name: Create .vercel directory and config
        working-directory: apps/admin
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<EOF
          {
            "projectId": "${{ env.VERCEL_PROJECT_ID }}",
            "orgId": "${{ env.VERCEL_ORG_ID }}"
          }
          EOF

      # 5) Build locally on the runner
      - name: Vercel build (admin)
        working-directory: apps/admin
        run: npx vercel@latest build --prod --yes --token "${{ env.VERCEL_TOKEN }}"

      # 6) Deploy the prebuilt output
      - name: Deploy to Vercel (prebuilt)
        working-directory: apps/admin
        run: npx vercel@latest deploy --prebuilt --prod --yes --token "${{ env.VERCEL_TOKEN }}"

  tenant:
    name: Deploy tenant-dashboard
    runs-on: ubuntu-latest
    needs: admin
    env:
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_TENANT }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps (root)
        run: pnpm install --no-frozen-lockfile

      - name: Create .vercel directory and config
        working-directory: apps/tenant-dashboard
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<EOF
          {
            "projectId": "${{ env.VERCEL_PROJECT_ID }}",
            "orgId": "${{ env.VERCEL_ORG_ID }}"
          }
          EOF

      - name: Vercel build (tenant)
        working-directory: apps/tenant-dashboard
        run: npx vercel@latest build --prod --yes --token "${{ env.VERCEL_TOKEN }}"

      - name: Deploy to Vercel (prebuilt)
        working-directory: apps/tenant-dashboard
        run: npx vercel@latest deploy --prebuilt --prod --yes --token "${{ env.VERCEL_TOKEN }}"

  site:
    name: Deploy site-renderer
    runs-on: ubuntu-latest
    needs: tenant
    env:
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_SITE }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps (root)
        run: pnpm install --no-frozen-lockfile

      - name: Create .vercel directory and config
        working-directory: apps/site-renderer
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<EOF
          {
            "projectId": "${{ env.VERCEL_PROJECT_ID }}",
            "orgId": "${{ env.VERCEL_ORG_ID }}"
          }
          EOF

      - name: Vercel build (site)
        working-directory: apps/site-renderer
        run: npx vercel@latest build --prod --yes --token "${{ env.VERCEL_TOKEN }}"

      - name: Deploy to Vercel (prebuilt)
        working-directory: apps/site-renderer
        run: npx vercel@latest deploy --prebuilt --prod --yes --token "${{ env.VERCEL_TOKEN }}"
