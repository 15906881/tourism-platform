name: Deploy monorepo apps to Vercel

on:
  push:
    branches:
      - pristine.04
  workflow_dispatch: {}

env:
  # shared
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  admin:
    name: Deploy admin
    runs-on: ubuntu-latest
    env:
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install deps (root)
        run: pnpm install --no-frozen-lockfile

      - name: Build admin app
        run: pnpm turbo run build --filter=admin

      - name: Create .vercel directory and config
        run: |
          mkdir -p apps/admin/.vercel
          cat > apps/admin/.vercel/project.json <<'JSON'
          {
            "projectId": "${{ env.VERCEL_PROJECT_ID }}",
            "orgId": "${{ env.VERCEL_ORG_ID }}",
            "settings": {
              "buildCommand": "cd ../../ && pnpm turbo run build --filter=admin",
              "outputDirectory": "apps/admin/.next"
            }
          }
          JSON

      - name: Deploy to Vercel (prebuilt)
        run: |
          cd apps/admin
          npx vercel@latest deploy --prebuilt --prod --token "${{ env.VERCEL_TOKEN }}"

  tenant:
    name: Deploy tenant-dashboard
    runs-on: ubuntu-latest
    needs: admin
    env:
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_TENANT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install deps (root)
        run: pnpm install --no-frozen-lockfile

      - name: Build tenant-dashboard app
        run: pnpm turbo run build --filter=tenant-dashboard

      - name: Create .vercel directory and config
        run: |
          mkdir -p apps/tenant-dashboard/.vercel
          cat > apps/tenant-dashboard/.vercel/project.json <<'JSON'
          {
            "projectId": "${{ env.VERCEL_PROJECT_ID }}",
            "orgId": "${{ env.VERCEL_ORG_ID }}",
            "settings": {
              "buildCommand": "cd ../../ && pnpm turbo run build --filter=tenant-dashboard",
              "outputDirectory": "apps/tenant-dashboard/.next"
            }
          }
          JSON

      - name: Deploy to Vercel (prebuilt)
        run: |
          cd apps/tenant-dashboard
          npx vercel@latest deploy --prebuilt --prod --token "${{ env.VERCEL_TOKEN }}"

  site:
    name: Deploy site-renderer
    runs-on: ubuntu-latest
    needs: tenant
    env:
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_SITE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install deps (root)
        run: pnpm install --no-frozen-lockfile

      - name: Build site-renderer app
        run: pnpm turbo run build --filter=site-renderer

      - name: Create .vercel directory and config
        run: |
          mkdir -p apps/site-renderer/.vercel
          cat > apps/site-renderer/.vercel/project.json <<'JSON'
          {
            "projectId": "${{ env.VERCEL_PROJECT_ID }}",
            "orgId": "${{ env.VERCEL_ORG_ID }}",
            "settings": {
              "buildCommand": "cd ../../ && pnpm turbo run build --filter=site-renderer",
              "outputDirectory": "apps/site-renderer/.next"
            }
          }
          JSON

      - name: Deploy to Vercel (prebuilt)
        run: |
          cd apps/site-renderer
          npx vercel@latest deploy --prebuilt --prod --token "${{ env.VERCEL_TOKEN }}"
