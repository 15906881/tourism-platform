name: Deploy monorepo apps to Vercel

on:
  push:
    branches:
      - pristine.04
  workflow_dispatch: {}

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  admin:
    name: Deploy admin (CRAN team)
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      - name: Build admin only
        run: pnpm turbo run build --filter=admin

      - name: Create .vercel config
        working-directory: apps/admin
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<'JSON'
          {
            "orgId": "${{ env.VERCEL_ORG_ID }}",
            "projectId": "${{ env.VERCEL_PROJECT_ID }}"
          }
          JSON

      - name: Deploy to Vercel
        working-directory: apps/admin
        run: npx vercel@latest deploy --prebuilt --prod --yes --token "${{ env.VERCEL_TOKEN }}"

  tenant:
    name: Deploy tenant (CRAN team)
    runs-on: ubuntu-latest
    needs: admin
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_TENANT }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      - name: Build tenant only
        run: pnpm turbo run build --filter=apps/tenant-dashboard --filter=tenant-dashboard --filter=tenant

      - name: Create .vercel config
        working-directory: apps/tenant-dashboard
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<'JSON'
          {
            "orgId": "${{ env.VERCEL_ORG_ID }}",
            "projectId": "${{ env.VERCEL_PROJECT_ID }}"
          }
          JSON

      - name: Deploy to Vercel
        working-directory: apps/tenant-dashboard
        run: npx vercel@latest deploy --prebuilt --prod --yes --token "${{ env.VERCEL_TOKEN }}"

  site:
    name: Deploy site-renderer (PERSONAL team)
    runs-on: ubuntu-latest
    needs: tenant
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID_SR }}   # 👈 personal/team_vwU...
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_SITE }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      - name: Build site-renderer only
        run: pnpm turbo run build --filter=site-renderer

      - name: Create .vercel config
        working-directory: apps/site-renderer
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<'JSON'
          {
            "orgId": "${{ env.VERCEL_ORG_ID }}",
            "projectId": "${{ env.VERCEL_PROJECT_ID }}"
          }
          JSON

      - name: Deploy to Vercel
        working-directory: apps/site-renderer
        run: npx vercel@latest deploy --prebuilt --prod --yes --token "${{ env.VERCEL_TOKEN }}"
