name: Build & Deploy 3 Vercel apps

on:
  push:
    branches:
      - pristine.04
  workflow_dispatch:

jobs:
  admin:
    name: Admin → Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      - name: Build admin
        run: pnpm turbo run build --filter=admin

      - name: Deploy admin to Vercel
        run: |
          npx vercel@latest deploy \
            --prod \
            --cwd apps/admin \
            --project ${{ secrets.VERCEL_PROJECT_ID_ADMIN }} \
            --token ${{ secrets.VERCEL_TOKEN }} \
            --scope ${{ secrets.VERCEL_TEAM_ID }}

  tenant:
    name: Tenant Dashboard → Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      - name: Build tenant-dashboard
        run: pnpm turbo run build --filter=tenant-dashboard

      - name: Deploy tenant-dashboard to Vercel
        run: |
          npx vercel@latest deploy \
            --prod \
            --cwd apps/tenant-dashboard \
            --project ${{ secrets.VERCEL_PROJECT_ID_TENANT }} \
            --token ${{ secrets.VERCEL_TOKEN }} \
            --scope ${{ secrets.VERCEL_TEAM_ID }}

  site:
    name: Site Renderer → Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      - name: Build site-renderer
        run: pnpm turbo run build --filter=site-renderer

      - name: Deploy site-renderer to Vercel
        run: |
          npx vercel@latest deploy \
            --prod \
            --cwd apps/site-renderer \
            --project ${{ secrets.VERCEL_PROJECT_ID_SITE }} \
            --token ${{ secrets.VERCEL_TOKEN }} \
            --scope ${{ secrets.VERCEL_TEAM_ID }}
