name: DB Migrate (Neon)

on:
  workflow_dispatch:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure psql client
        shell: bash
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y postgresql-client
          fi
          psql --version

      - name: Start log file
        run: : > ci_migrate.log

      - name: Run migrations against Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: |
          set -o pipefail
          bash -x scripts/migrate.sh 2>&1 | tee -a ci_migrate.log

      - name: Smoke test (non-blocking)
        if: always()
        env:
          APP_DB_URL: ${{ secrets.APP_DB_URL }}
        shell: bash
        run: |
          set -o pipefail
          if [ -n "${APP_DB_URL:-}" ]; then
            echo "==> smoke test" | tee -a ci_migrate.log
            psql "$APP_DB_URL" -Atc 'select 1;' | tee -a ci_migrate.log
          else
            echo "==> no APP_DB_URL; skipping" | tee -a ci_migrate.log
          fi

      - name: Upload DB logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-logs
          path: ci_migrate.log
          if-no-files-found: warn
