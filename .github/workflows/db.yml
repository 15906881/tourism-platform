name: DB

on:
  workflow_dispatch:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  db-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Ensure log file exists
        run: : > ci_migrate.log

      - name: Install psql client
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y postgresql-client

      - name: Connectivity check (owner)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "==> psql version" | tee -a ci_migrate.log
          psql --version | tee -a ci_migrate.log
          echo "==> \conninfo (owner)" | tee -a ci_migrate.log
          psql "$DATABASE_URL" -c '\conninfo' 2>&1 | tee -a ci_migrate.log

      - name: Run migrations (owner)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: |
          set -o pipefail
          bash -x scripts/migrate.sh 2>&1 | tee -a ci_migrate.log

      - name: RLS smoke test (non-blocking)
        if: always()
        continue-on-error: true
        env:
          APP_DB_URL: ${{ secrets.APP_DB_URL }}
        shell: bash
        run: |
          if [ -f scripts/db_smoke.sh ]; then
            set -o pipefail
            bash -x scripts/db_smoke.sh 2>&1 | tee -a ci_migrate.log
          else
            echo "no db_smoke.sh; skipping" | tee -a ci_migrate.log
          fi

      - name: Scrub secrets from log (mask any password-like parts)
        if: always()
        shell: bash
        run: |
          # Mask ...://user:PASSWORD@host patterns to avoid leaking creds in artifacts
          sed -E -i 's#(postgres(ql)?://[^:]+:)[^@]+(@)#\1***\3#g' ci_migrate.log || true

      - name: Upload DB logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-logs
          path: ci_migrate.log
          if-no-files-found: warn
