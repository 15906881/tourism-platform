name: DB

on:
  workflow_dispatch:
  push:
    branches: [develop, fix/db-ci]

jobs:
  db-migrations:
    runs-on: ubuntu-latest

    # Run the job inside a Linux container that shares a network with services.
    container:
      image: ubuntu:24.04

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
        # NOTE: no 'ports:' when using a job container

    steps:
      - uses: actions/checkout@v4

      - name: Ensure log file exists (always artifactable)
        run: : > ci_migrate.log

      - name: Install psql client & tools
        run: |
          apt-get update -y
          DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates curl git postgresql-client

      - name: Connectivity diagnostics
        shell: bash
        run: |
          {
            echo "==> Hostname"
            hostname
            echo "==> /etc/hosts"
            sed -n '1,200p' /etc/hosts
            echo "==> DNS for 'postgres'"
            getent hosts postgres || true
            echo "==> pg_isready raw"
            pg_isready -h postgres -p 5432 -U postgres -d postgres || true
          } | tee -a ci_migrate.log

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
        shell: bash
        run: |
          set -o pipefail
          bash -x scripts/migrate.sh 2>&1 | tee -a ci_migrate.log

      - name: Upload DB logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-logs
          path: ci_migrate.log
          if-no-files-found: warn
