name: DB

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/db.yml"
      - "db/**"
      - "scripts/migrate.sh"
  pull_request:
    paths:
      - "db/**"
      - "scripts/migrate.sh"

jobs:
  db-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - "5432.0.0.1:5432"
