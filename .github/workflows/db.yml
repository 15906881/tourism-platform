cat > .github/workflows/db.yml <<'YAML'
name: DB

on:
  workflow_dispatch:
  push:
    paths:
      - "db/**"
      - "scripts/**"
      - ".github/workflows/db.yml"
  pull_request:
    paths:
      - "db/**"
      - "scripts/**"
      - ".github/workflows/db.yml"

jobs:
  db-migrations:
    runs-on: ubuntu-latest

    services:
      postgres:                      # <— service name is 'postgres'
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Verify connection
        env:
          DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
        run: psql "$DATABASE_URL" -c 'select version();'

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
        run: bash scripts/migrate.sh

      - name: RLS smoke test
        env:
          APP_DB_URL: postgresql://tp_user:tp_password@postgres:5432/postgres
        run: bash scripts/db_smoke.sh
YAML
