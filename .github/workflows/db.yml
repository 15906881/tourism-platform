name: DB

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  db-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:                    # service key = container hostname
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
        run: bash scripts/migrate.sh

      - name: RLS smoke test (non-blocking while we debug)
        continue-on-error: true
        env:
          APP_DB_URL: postgresql://tp_user:tp_password@postgres:5432/postgres
        run: bash scripts/db_smoke.sh
