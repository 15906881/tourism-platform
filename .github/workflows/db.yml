name: DB

on:
  workflow_dispatch:
  push:
    branches: [develop]

jobs:
  db-migrations:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - name: Ensure log file exists (always artifactable)
        run: : > ci_migrate.log

      - name: Install psql client
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y postgresql-client

      - name: Connectivity diagnostics
        shell: bash
        run: |
          {
            echo "==> /etc/hosts"
            sed -n '1,200p' /etc/hosts
            echo "==> DNS for 'postgres'"
            getent hosts postgres || true
            echo "==> pg_isready"
            pg_isready -h postgres -p 5432 -U postgres -d postgres || true
          } | tee -a ci_migrate.log

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
        shell: bash
        run: |
          set -o pipefail
          bash -x scripts/migrate.sh 2>&1 | tee -a ci_migrate.log

      - name: RLS smoke test (non-blocking)
        continue-on-error: true
        env:
          APP_DB_URL: postgresql://tp_user:tp_password@postgres:5432/postgres
        shell: bash
        run: |
          set -o pipefail
          bash -x scripts/db_smoke.sh 2>&1 | tee -a ci_migrate.log

      - name: Upload DB logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-logs
          path: ci_migrate.log
          if-no-files-found: warn
