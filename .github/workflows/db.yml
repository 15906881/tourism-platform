name: DB

on:
  workflow_dispatch:
  push:
    branches: [develop]

jobs:
  db-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure log file exists
        run: : > ci_migrate.log

      - name: Install psql client
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y postgresql-client

      - name: Run migrations against Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: |
          set -o pipefail
          bash -x scripts/migrate.sh 2>&1 | tee -a ci_migrate.log

      - name: RLS smoke test (non-blocking)
        if: always()
        continue-on-error: true
        env:
          APP_DB_URL: ${{ secrets.APP_DB_URL }}
        shell: bash
        run: |
          if [ -f scripts/db_smoke.sh ]; then
            set -o pipefail
            bash -x scripts/db_smoke.sh 2>&1 | tee -a ci_migrate.log
          else
            echo "no db_smoke.sh; skipping" | tee -a ci_migrate.log
          fi

      - name: Upload DB logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-logs
          path: ci_migrate.log
          if-no-files-found: warn
