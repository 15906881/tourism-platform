name: DB

on:
  workflow_dispatch:
  push:
    branches: [develop]

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: echo "hello from Actions" | tee ci_migrate.log
      - uses: actions/upload-artifact@v4
        with:
          name: db-logs
          path: ci_migrate.log
          if-no-files-found: warn
