name: DB

on:
  workflow_dispatch:
  push:
    branches:
      - develop

jobs:
  db-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install psql client
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y postgresql-client

      - name: Ensure log file exists
        run: : > ci_migrate.log

      - name: psql version
        run: |
          echo "==> psql version" | tee -a ci_migrate.log
          psql --version        | tee -a ci_migrate.log

      - name: Print env (redacted)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "ERROR: DATABASE_URL secret is empty" | tee -a ci_migrate.log
            exit 1
          fi
          redacted="$(printf '%s\n' "$DATABASE_URL" | sed -E 's#://([^:/]+):([^@]+)@#://\1:******@#')"
          echo "==> DATABASE_URL (redacted): $redacted" | tee -a ci_migrate.log

      - name: Show schema
        run: |
          echo "==> ls db" | tee -a ci_migrate.log
          ls -la db        | tee -a ci_migrate.log || true
          echo "==> head -n 80 db/schema.sql" | tee -a ci_migrate.log
          sed -n '1,80p' db/schema.sql | tee -a ci_migrate.log || true

      - name: Run migrations against Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: |
          set -o pipefail
          echo "==> connectivity check" | tee -a ci_migrate.log
          if psql "$DATABASE_URL" -c "select version();" >> ci_migrate.log 2>&1; then
            echo "DB reachable" | tee -a ci_migrate.log
          else
            echo "DB NOT reachable" | tee -a ci_migrate.log
          fi

          echo "==> running migrate.sh" | tee -a ci_migrate.log
          bash -x scripts/migrate.sh 2>&1 | tee -a ci_migrate.log

      - name: RLS smoke test (non-blocking)
        if: always()
        continue-on-error: true
        env:
          APP_DB_URL: ${{ secrets.APP_DB_URL }}
        shell: bash
        run: |
          set -o pipefail
          if [ -z "${APP_DB_URL:-}" ]; then
            echo "no APP_DB_URL; skipping smoke test" | tee -a ci_migrate.log
          else
            echo "==> simple smoke test" | tee -a ci_migrate.log
            psql "$APP_DB_URL" -Atc 'select 1;' | tee -a ci_migrate.log
          fi

      - name: Upload DB logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-logs
          path: ci_migrate.log
          if-no-files-found: warn
