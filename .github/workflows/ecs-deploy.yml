name: Deploy to ECS

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App to deploy'
        required: true
        default: 'tenant-dashboard'
        type: choice
        options:
        - tenant-dashboard
        - admin
        - site-renderer
        - onboarding
        - photos-entry
      environment:
        description: 'Environment'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Build and push Docker image
      run: |
        APP="${{ github.event.inputs.app }}"
        ENVIRONMENT="${{ github.event.inputs.environment || 'staging' }}"
        
        # Build with app argument
        docker build -t 247006907925.dkr.ecr.us-east-1.amazonaws.com/tourism-\$APP:\$ENVIRONMENT \
          --build-arg app=\$APP \
          -f apps/\$APP/Dockerfile .
        
        echo "TODO: Push to ECR and update ECS service for port 3000"
        
    - name: Update ECS service configuration
      run: |
        echo "Remember to update ECS for:"
        echo "- Container port: 3000"
        echo "- Health check: :3000/health"
        echo "- Target group: port 3000"
