name: Deploy site-renderer (personal account)

on:
  push:
    branches:
      - pristine.04
    paths:
      - "apps/site-renderer/**"
      - ".github/workflows/deploy-site-renderer-personal.yml"
  workflow_dispatch: {}

jobs:
  site:
    name: Deploy site-renderer to personal account
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps (root)
        run: pnpm install --no-frozen-lockfile

      - name: Build ONLY site-renderer
        run: pnpm turbo run build --filter=site-renderer

      - name: Deploy to personal Vercel account
        working-directory: apps/site-renderer
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_SR }}  # Your personal account token
        run: |
          echo "🔧 Deploying to personal Vercel account (CRANADMIN)..."
          
          # Deploy without team scope (uses personal account)
          npx vercel@latest deploy \
            --prod \
            --yes \
            --token "$VERCEL_TOKEN"
