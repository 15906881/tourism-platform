name: Deploy site-renderer (personal)

on:
  push:
    branches:
      - pristine.04
  workflow_dispatch: {}

jobs:
  site:
    name: Deploy site-renderer to personal team
    runs-on: ubuntu-latest
    env:
      # personal team values
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID_SR }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_SITE }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_SR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps (root)
        run: pnpm install --no-frozen-lockfile

      - name: Build ONLY site-renderer
        run: pnpm turbo run build --filter=site-renderer

      - name: Create vercel.json to skip build
        working-directory: apps/site-renderer
        run: |
          cat > vercel.json <<'JSON'
          {
            "version": 2,
            "builds": [
              {
                "src": "package.json",
                "use": "@vercel/static-build",
                "config": {
                  "zeroConfig": true
                }
              }
            ],
            "buildCommand": "echo 'Already built by GitHub Actions'",
            "outputDirectory": ".next"
          }
          JSON

      - name: Create .vercel directory and config
        working-directory: apps/site-renderer
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<'JSON'
          {
            "projectId": "${{ env.VERCEL_PROJECT_ID }}",
            "orgId": "${{ env.VERCEL_ORG_ID }}"
          }
          JSON

      - name: Vercel local build (creates .vercel/output)
        working-directory: apps/site-renderer
        run: npx vercel@latest build --prod --yes --token "${{ env.VERCEL_TOKEN }}"

      - name: Deploy prebuilt to personal
        working-directory: apps/site-renderer
        run: npx vercel@latest deploy --prebuilt --prod --yes --token "${{ env.VERCEL_TOKEN }}"
