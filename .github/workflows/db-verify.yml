name: db: verify migrations
on:
  pull_request: { branches: [develop, main] }
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - env: { PGPASSWORD: postgres }
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do sleep 1; done

          # apply migrations in order
          shopt -s nullglob
          for f in database/migrations/*.sql; do
            echo ">> applying $f"
            psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f "$f"
          done

          # RLS smoke: two tenants, each sees only its rows
          psql -h localhost -U postgres -d postgres <<'SQL'
          -- make two tenants
          insert into app.tenant(code,name)
          values ('t1','Tenant One'), ('t2','Tenant Two')
          on conflict (code) do nothing;

          -- insert a row for each tenant with the correct session setting
          select set_config('app.tenant_id', (select id::text from app.tenant where code='t1'), false);
          insert into app.hello(tenant_id, msg)
            values ((select id from app.tenant where code='t1'), 'hello t1');

          select set_config('app.tenant_id', (select id::text from app.tenant where code='t2'), false);
          insert into app.hello(tenant_id, msg)
            values ((select id from app.tenant where code='t2'), 'hello t2');

          -- t1 can only see its own
          select set_config('app.tenant_id', (select id::text from app.tenant where code='t1'), false);
          select count(*) = 1 as only_t1 from app.hello;

          -- t2 can only see its own
          select set_config('app.tenant_id', (select id::text from app.tenant where code='t2'), false);
          select count(*) = 1 as only_t2 from app.hello;

          -- without a tenant set, access is denied by policy (expect 0 rows)
          select set_config('app.tenant_id', null, false);
          select count(*) = 0 as no_access from app.hello where true;
          SQL
