name: Deploy CRAN apps (admin + tenant)

on:
  push:
    branches: [ pristine.04 ]
    paths:
      - "apps/admin/**"
      - "apps/tenant-dashboard/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "turbo.json"
  workflow_dispatch: {}

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}          # CRAN team
  VERCEL_TOKEN:  ${{ secrets.VERCEL_TOKEN }}           # CRAN token

jobs:
  admin:
    runs-on: ubuntu-latest
    env:
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.0  # Fixed to match package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm turbo run build --filter=admin
      - name: Deploy admin
        working-directory: apps/admin
        run: npx vercel@latest deploy --prod --yes --token "${{ env.VERCEL_TOKEN }}"

  tenant:
    runs-on: ubuntu-latest
    needs: admin
    env:
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_TENANT }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.0  # Fixed to match package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm turbo run build --filter=tenant-dashboard
      - name: Deploy tenant
        working-directory: apps/tenant-dashboard
        run: npx vercel@latest deploy --prod --yes --token "${{ env.VERCEL_TOKEN }}"
