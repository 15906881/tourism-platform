name: ci

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch: {}
  push:
    branches: [develop, main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      # Match repo's packageManager version
      - uses: pnpm/action-setup@v2
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install deps (frozen)
        run: pnpm install --frozen-lockfile

      - name: Type check (apps only)
        run: pnpm -r --filter "./apps/*" --if-present exec tsc --noEmit
        continue-on-error: true

      - name: Lint (apps only)
        run: pnpm -r --filter "./apps/*" --if-present lint

      - name: Build (apps only)
        run: pnpm -r --filter "./apps/*" --if-present build

