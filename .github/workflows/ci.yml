name: CI
on:
  push:
    branches: [ "Pristine.02" ]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node (20.x)
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.5'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      
      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> $GITHUB_OUTPUT
      
      - name: Restore pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      # Build shared packages FIRST (in correct order)
      - name: Build tokens package
        run: pnpm --filter @weblynk/tokens build
      
      - name: Build UI package
        run: pnpm --filter @weblynk/ui build
      
      - name: Build database package
        run: pnpm --filter @weblynk/db build
      
      - name: Build templates package
        run: pnpm --filter @weblynk/templates build
      
      # Now build apps (they can now resolve @weblynk/* packages)
      - name: Build admin app
        run: pnpm --filter admin build
      
      - name: Build site-renderer app
        run: pnpm --filter site-renderer build
      
      - name: Build tenant-dashboard app
        run: pnpm --filter tenant-dashboard build
