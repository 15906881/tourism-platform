name: CI

on:
  workflow_dispatch: {}     # manual "Run workflow" button
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ develop ]

jobs:
  sanity:
    name: Required files exist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required docs
        run: |
          set -euo pipefail
          for f in PROJECT_PLAN_PHASE1.md CHANGELOG.md README_PHASE1_SHIP-READY.md; do
            test -f "$f" || { echo "::error::Missing required file: $f"; exit 1; }
          done
          echo "All required files present."

  markdown:
    name: Markdown lint (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install markdownlint-cli
        run: npm i -g markdownlint-cli@0.41.0
      - name: Run markdownlint
        run: markdownlint -c .markdownlint.json -i .markdownlintignore CHANGELOG.md PROJECT_PLAN_PHASE1.md || echo "::warning::markdownlint advisory warnings"

  node-qa:
    name: Node QA (lint/format) — advisory if present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect Node project
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: 20

      - name: Install deps
        if: steps.detect.outputs.present == 'true'
        run: |
          if [ -f package-lock.json ]; then
            npm ci || true
          else
            npm install || true
          fi

      - name: Format check
        if: steps.detect.outputs.present == 'true'
        run: npm run format:check || true

      - name: Lint check
        if: steps.detect.outputs.present == 'true'
        run: npm run lint:check || true

      - name: No Node project — skip
        if: steps.detect.outputs.present != 'true'
        run: echo "No package.json found; skipping Node QA."

  build:
    name: Build (placeholder)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build placeholder
        run: echo "Build OK (placeholder)"
