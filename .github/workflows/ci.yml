[copy optimized CI workflow from artifact]

      # Cache Next.js builds for faster CI
      - name: Cache Next.js builds
        uses: actions/cache@v3
        with:
          path: |
            ~/.pnpm-store
            **/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-
