name: CI

on:
  push:
    branches: [ "Pristine.02" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (20.x)
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.5'
          cache: 'pnpm'

      - name: Enable Corepack & pnpm@9
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate
          pnpm -v

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile --prod=false

      - name: Build admin (with deps)
        run: pnpm -r --filter '...admin' --if-present build

      - name: Build site-renderer (with deps)
        run: pnpm -r --filter '...site-renderer' --if-present build

      - name: Build tenant-dashboard (with deps)
        run: pnpm -r --filter '...tenant-dashboard' --if-present build
