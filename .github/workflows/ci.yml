name: CI

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ develop ]

jobs:
  sanity:
    name: Required files exist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required docs
        run: |
          set -euo pipefail
          for f in PROJECT_PLAN_PHASE1.md CHANGELOG.md README_PHASE1_SHIP-READY.md; do
            test -f "$f" || { echo "::error::Missing required file: $f"; exit 1; }
          done
          echo "All required files present."

  markdown:
    name: Markdown lint (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install markdownlint-cli
        run: npm i -g markdownlint-cli@0.41.0
      - name: Run markdownlint
        run: markdownlint -c .markdownlint.json -i .markdownlintignore CHANGELOG.md PROJECT_PLAN_PHASE1.md || echo "::warning::markdownlint advisory warnings"

  node-qa:
    name: Node QA (lint/format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run lint || true
      - run: npm run format:check

  build:
    name: Build (placeholder)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build placeholder
        run: echo "Build OK (placeholder)"
