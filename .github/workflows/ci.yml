name: ci

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, develop]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    branches: [main, develop]
    paths-ignore: ['**/*.md', 'docs/**']

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      # Match repo's packageManager version from package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install deps (frozen)
        run: pnpm install --frozen-lockfile

      # Generate Prisma client from the canonical schema
      - name: Prisma generate (idempotent)
        run: pnpm --dir packages/db prisma generate || true

      # Build shared design packages (safe no-ops if package missing)
      - name: Build design packages (tokens/ui)
        run: |
          pnpm -r --filter "@weblynk/tokens" --if-present build
          pnpm -r --filter "@weblynk/ui" --if-present build

      # 🔑 Build backend libs needed by apps (fixes @weblynk/server not found)
      - name: Build backend libs (server + db)
        run: |
          pnpm -r --filter "@weblynk/server" --if-present build
          pnpm -r --filter "@weblynk/db" --if-present build

      # Lint (apps only; skips app if it lacks a lint script)
      - name: Lint (apps only)
        run: pnpm -r --filter "./apps/*" --if-present lint

      # Type check (apps only); soft-fail to keep CI informative
      - name: Type check (apps only)
        run: pnpm -r --filter "./apps/*" exec tsc --noEmit
        continue-on-error: true

      # Build apps after libs are compiled
      - name: Build (apps only)
        env:
          # Helps avoid ENOSPC cache issues on runners
          NEXT_DISABLE_WEBPACK_CACHE: 1
        run: pnpm -r --filter "./apps/*" --if-present build
