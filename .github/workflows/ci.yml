name: CI
on:
  push:
    branches: [ 'Pristine.02' ]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    
    # Add PostgreSQL service
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tourism_dev
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node (20.x)
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.5'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      
      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> $GITHUB_OUTPUT
      
      - name: Restore pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      # Setup database
      - name: Setup PostgreSQL extensions and schema
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d tourism_dev -c "CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";"
          psql -h localhost -U postgres -d tourism_dev -c "CREATE SCHEMA IF NOT EXISTS core;"
          psql -h localhost -U postgres -d tourism_dev -c "ALTER DATABASE tourism_dev SET search_path TO core,public;"
          psql -h localhost -U postgres -d postgres -c "CREATE DATABASE tourism_shadow OWNER postgres;"
          psql -h localhost -U postgres -d tourism_shadow -c "CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";"
          psql -h localhost -U postgres -d tourism_shadow -c "CREATE SCHEMA IF NOT EXISTS core;"
      
      # Push database schema (creates all tables from scratch)
      - name: Setup database schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tourism_dev?schema=core
          PRISMA_SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tourism_shadow?schema=core
        run: |
          cd packages/db
          pnpm prisma db push --skip-generate
          pnpm prisma generate
      
      # Build base packages (no @weblynk dependencies)
      - name: Build base packages
        run: |
          pnpm --filter @weblynk/tokens build
          pnpm --filter @weblynk/db build
          pnpm --filter @weblynk/auth build
          pnpm --filter @weblynk/server build
      
      # Build UI layer packages
      - name: Build UI packages
        run: |
          pnpm --filter @weblynk/ui build
          pnpm --filter @weblynk/blocks build
          pnpm --filter @weblynk/templates build
      
      # Build all apps
      - name: Build apps
        run: |
          pnpm --filter admin build
          pnpm --filter site-renderer build
          pnpm --filter tenant-dashboard build
