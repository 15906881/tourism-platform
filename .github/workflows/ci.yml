name: CI
on:
  push:
    branches: [ 'Pristine.02' ]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node (20.x)
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.5'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      
      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> $GITHUB_OUTPUT
      
      - name: Restore pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      # Build base packages (no @weblynk dependencies)
      - name: Build base packages
        run: |
          pnpm --filter @weblynk/tokens build
          pnpm --filter @weblynk/db build
          pnpm --filter @weblynk/auth build
          pnpm --filter @weblynk/server build
      
      # Build UI layer packages
      - name: Build UI packages
        run: |
          pnpm --filter @weblynk/ui build
          pnpm --filter @weblynk/blocks build
          pnpm --filter @weblynk/templates build
      
      # Build all apps
      - name: Build apps
        run: |
          pnpm --filter admin build
          pnpm --filter site-renderer build
          pnpm --filter tenant-dashboard build
