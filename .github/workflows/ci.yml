name: ci

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, develop, integrate/**]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    branches: [main, develop, integrate/**]
    paths-ignore: ['**/*.md', 'docs/**']

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Install deps (frozen)
        run: pnpm install --frozen-lockfile

      - name: Prisma generate (idempotent)
        run: pnpm -C packages/db prisma generate || true

      - name: Lint (apps only)
        run: pnpm -r --filter "./apps/*" --if-present lint

      # ✅ Build libraries first so their type declarations exist
      - name: Build packages (libs first)
        run: pnpm -r --filter "./packages/*" --if-present build

      # Now TS can resolve @weblynk/ui, @weblynk/blocks, etc.
      - name: Type check (apps only)
        run: pnpm -r --filter "./apps/*" exec tsc --noEmit
        continue-on-error: true

      - name: Build apps
        env:
          ONBOARDING_SIGNING_SECRET: ${{ secrets.ONBOARDING_SIGNING_SECRET }}
          NEXTAUTH_SECRET:          ${{ secrets.NEXTAUTH_SECRET }}
        run: pnpm -r --filter "./apps/*" --if-present build
