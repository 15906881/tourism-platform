name: CI

on:
  push:
    branches: [ "Pristine.02" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (20.x)
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.5'

      - name: Enable Corepack (use repo-pinned pnpm)
        run: |
          corepack enable
          corepack install
          pnpm -v

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Restore pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install deps (frozen)
        run: pnpm install --frozen-lockfile --prod=false

      # Build with dependency graph so packages build before apps
      - name: Build admin (with deps)
        run: pnpm -r --filter '...admin' --if-present build

      - name: Build site-renderer (with deps)
        run: pnpm -r --filter '...site-renderer' --if-present build

      - name: Build tenant-dashboard (with deps)
        run: pnpm -r --filter '...tenant-dashboard' --if-present build
