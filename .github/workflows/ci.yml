name: ci

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch: {}
  push:
    branches: [develop, main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      # Match repo's packageManager version
      - uses: pnpm/action-setup@v2
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install deps (frozen)
        run: pnpm install --frozen-lockfile

      # If any app imports @prisma/client at build-time, this ensures it's generated
      - name: Prisma generate (idempotent)
        run: pnpm -C packages/db prisma generate || true

      - name: Type check (all workspaces)
        run: pnpm -r --if-present exec tsc --noEmit
        continue-on-error: true

      - name: Lint (all workspaces)
        run: pnpm -r --if-present lint

      # Build everything that declares a "build" script (packages + apps)
      - name: Build (all workspaces)
        run: pnpm -r --if-present build
