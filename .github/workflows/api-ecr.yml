name: API → ECR
on:
  push:
    branches: [develop]
    paths:
      - 'api/**'
      - 'Dockerfile'
      - '.github/workflows/api-ecr.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  id-token: write   # OIDC to assume your AWS role
  contents: read
concurrency:
  group: api-ecr-${{ github.ref }}
  cancel-in-progress: true
env:
  AWS_REGION: us-east-1
  ECR_REPO: tourism-api
jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPO" --region "$AWS_REGION" >/dev/null 2>&1 || \
          aws ecr create-repository --repository-name "$ECR_REPO" \
            --image-scanning-configuration scanOnPush=true \
            --region "$AWS_REGION"
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Debug - List files and show Dockerfile
        run: |
          echo "=== Current directory ==="
          pwd
          echo "=== List all files ==="
          ls -la
          echo "=== Check Dockerfile specifically ==="
          ls -la Dockerfile || echo "Dockerfile not found"
          echo "=== Dockerfile contents ==="
          cat Dockerfile || echo "Cannot read Dockerfile"
          echo "=== File type ==="
          file Dockerfile || echo "Cannot check file type"
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:develop
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:develop-${{ github.sha }}
          build-args: |
            NODE_ENV=production
