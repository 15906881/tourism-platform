name: Weekly Full Check
on:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  workflow_dispatch:
jobs:
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.5'
      - name: Enable Corepack
        run: corepack enable
      - name: Install (frozen)
        run: pnpm install --frozen-lockfile --prod=false
      - name: Build graph (packages then apps)
        run: |
          pnpm --filter @weblynk/tokens build
          pnpm --filter @weblynk/db build
          pnpm --filter @weblynk/auth build
          pnpm --filter @weblynk/server build
          pnpm --filter @weblynk/ui build
          pnpm --filter @weblynk/blocks build
          pnpm --filter @weblynk/templates build
          pnpm --filter admin build
          pnpm --filter site-renderer build
          pnpm --filter tenant-dashboard build
      - name: Typecheck & Lint (non-blocking)
        run: |
          pnpm -r --if-present typecheck || true
          pnpm -r --if-present lint || true
      - name: E2E smoke (optional; skip if none)
        run: pnpm -w --if-present test:e2e || true
