name: Deploy site-renderer (personal team only)

on:
  push:
    branches:
      - pristine.04
    paths:
      - "apps/site-renderer/**"
      - ".github/workflows/deploy-site-renderer.yml"
  workflow_dispatch: {}

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  site-renderer:
    name: Deploy site-renderer to personal team
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID_SR }}           # PERSONAL TEAM ONLY
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_SITE }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm (matches package.json)
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build site-renderer
        run: pnpm turbo run build --filter=site-renderer

      - name: Configure Vercel project
        working-directory: apps/site-renderer
        run: |
          mkdir -p .vercel
          echo '{
            "orgId": "${{ env.VERCEL_ORG_ID }}",
            "projectId": "${{ env.VERCEL_PROJECT_ID }}"
          }' > .vercel/project.json

      - name: Deploy to Vercel (personal team)
        working-directory: apps/site-renderer
        run: npx vercel@latest deploy --prebuilt --prod --yes --token "${{ env.VERCEL_TOKEN }}"
