name: Deploy site-renderer to personal account

on:
  push:
    branches:
      - pristine.04
  workflow_dispatch: {}

jobs:
  site-renderer:
    runs-on: ubuntu-latest
    env:
      # ✅ these are your NEW project-specific secrets
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID_SR }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_SITE }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_SR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps (root)
        run: pnpm install --no-frozen-lockfile

      - name: Build site-renderer
        run: pnpm turbo run build --filter=site-renderer

      # 🔥 AGGRESSIVE CLEANUP - remove ALL existing Vercel configs
      - name: Remove ALL old Vercel configs
        run: |
          echo "Removing all .vercel folders and vercel.json files..."
          find . -name ".vercel" -type d -exec rm -rf {} + || true
          find . -name "vercel.json" -type f -delete || true
          echo "Cleanup complete!"

      # 🧠 write the CORRECT project.json for THIS project
      - name: Write local Vercel project config
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<'JSON'
          {
            "orgId": "$VERCEL_ORG_ID",
            "projectId": "$VERCEL_PROJECT_ID"
          }
          JSON

      # 🚀 deploy from REPO ROOT (fixes path doubling)
      - name: Deploy to Vercel
        run: |
          npx vercel@latest deploy . \
            --prod \
            --yes \
            --scope cranadmin \
            --token "$VERCEL_TOKEN"
