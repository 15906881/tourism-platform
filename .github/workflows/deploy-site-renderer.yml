name: Deploy site-renderer to personal account

on:
  push:
    branches:
      - pristine.04
  workflow_dispatch: {}

jobs:
  site-renderer:
    runs-on: ubuntu-latest
    env:
      # your PERSONAL / CRANADMIN team secrets
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID_SR }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_SITE }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_SR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps (root)
        run: pnpm install --no-frozen-lockfile

      # 👇 this is the important change
      - name: Write local Vercel project config (override remote)
        working-directory: apps/site-renderer
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<'JSON'
          {
            "orgId": "$VERCEL_ORG_ID",
            "projectId": "$VERCEL_PROJECT_ID",
            "settings": {
              "framework": "nextjs",
              "installCommand": "",
              "buildCommand": "",
              "outputDirectory": ".vercel/output",
              "rootDirectory": "apps/site-renderer"
            }
          }
          JSON

      - name: Build with Vercel (local / prebuilt)
        working-directory: apps/site-renderer
        run: |
          npx vercel@latest build \
            --prod \
            --yes \
            --token "$VERCEL_TOKEN"

      - name: Deploy prebuilt to Vercel
        working-directory: apps/site-renderer
        run: |
            npx vercel@latest deploy \
              --prebuilt \
              --prod \
              --yes \
              --token "$VERCEL_TOKEN"
