name: Deploy site-renderer (personal vercel team)

on:
  push:
    branches:
      - pristine.04
    paths:
      - "apps/site-renderer/**"
      - ".github/workflows/deploy-site-renderer.yml"
  workflow_dispatch: {}

jobs:
  site:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID_SR }}           # 👈 personal team
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_SITE }} # existing project id
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.0  # 👈 FIXED: matches package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps (root)
        run: pnpm install --no-frozen-lockfile

      - name: Build site-renderer only
        run: pnpm turbo run build --filter=site-renderer

      - name: Create .vercel config
        working-directory: apps/site-renderer
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<'JSON'
          {
            "orgId": "${{ env.VERCEL_ORG_ID }}",
            "projectId": "${{ env.VERCEL_PROJECT_ID }}"
          }
          JSON

      - name: Deploy to Vercel
        working-directory: apps/site-renderer
        run: npx vercel@latest deploy --prebuilt --prod --yes --token "${{ env.VERCEL_TOKEN }}"
