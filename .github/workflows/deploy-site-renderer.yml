name: Deploy site-renderer (host-only, app-dir)

on:
  push:
    branches: [pristine.04]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID_SR }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_SITE }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_SR }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 10.4.0 }

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Clean up ANY existing .vercel configs first
      - name: Clean all .vercel configs
        run: |
          find . -name ".vercel" -type d -exec rm -rf {} + || true
          find . -name "vercel.json" -type f -delete || true

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      - name: Build app (+internal packages)
        run: pnpm turbo run build --filter=site-renderer

      - name: Sanity check build output
        run: |
          test -f apps/site-renderer/.next/build-manifest.json
          test -d apps/site-renderer/.next/static

      - name: Link to Vercel project with OVERRIDDEN root directory
        working-directory: apps/site-renderer
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<'JSON'
          {
            "orgId": "$VERCEL_ORG_ID",
            "projectId": "$VERCEL_PROJECT_ID",
            "settings": {
              "rootDirectory": ""
            }
          }
          JSON
          echo "Project config:"
          cat .vercel/project.json

      - name: Debug current directory structure
        working-directory: apps/site-renderer
        run: |
          echo "=== Current directory ==="
          pwd
          echo "=== Contents ==="
          ls -la
          echo "=== .vercel contents ==="
          ls -la .vercel/ || echo "No .vercel folder"

      - name: Deploy from app directory
        working-directory: apps/site-renderer
        run: |
          npx vercel@48.8.0 deploy \
            --prod \
            --yes \
            --scope cranadmin \
            --token "$VERCEL_TOKEN"
