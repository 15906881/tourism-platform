name: Deploy site-renderer to personal account

on:
  push:
    branches:
      - pristine.04
  workflow_dispatch: {}

jobs:
  site-renderer:
    runs-on: ubuntu-latest
    env:
      # personal / cranadmin TEAM
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID_SR }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_SITE }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_SR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps (root)
        run: |
          # that preinstall in your repo tries to copy to /packages and fails
          # but install still finishes, so we just let it run
          pnpm install --no-frozen-lockfile

      - name: Create Vercel project config
        working-directory: apps/site-renderer
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<'JSON'
          {
            "projectId": "${{ env.VERCEL_PROJECT_ID }}",
            "orgId": "${{ env.VERCEL_ORG_ID }}"
          }
          JSON

      - name: Build with Vercel (local / prebuilt)
        working-directory: apps/site-renderer
        run: |
          npx vercel@latest build \
            --prod \
            --yes \
            --token "$VERCEL_TOKEN"

      - name: Deploy prebuilt to Vercel
        working-directory: apps/site-renderer
        run: |
          npx vercel@latest deploy \
            --prebuilt \
            --prod \
            --yes \
            --token "$VERCEL_TOKEN"name: Deploy site-renderer (personal team only)

on:
  push:
    branches:
      - pristine.04
    paths:
      - "apps/site-renderer/**"
      - ".github/workflows/deploy-site-renderer.yml"
  workflow_dispatch: {}

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  site-renderer:
    name: Deploy site-renderer to personal team
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID_SR }}           # PERSONAL TEAM ONLY
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_SITE }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm (matches package.json)
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build site-renderer with turbo
        run: pnpm turbo run build --filter=site-renderer

      - name: Clean any existing Vercel config
        working-directory: apps/site-renderer
        run: |
          rm -rf .vercel
          rm -f vercel.json

      - name: Deploy to Vercel (Vercel will discover the built app)
        working-directory: apps/site-renderer
        run: |
          npx vercel@latest deploy \
            --prod \
            --yes \
            --token "${{ env.VERCEL_TOKEN }}" \
            --scope "${{ env.VERCEL_ORG_ID }}"
