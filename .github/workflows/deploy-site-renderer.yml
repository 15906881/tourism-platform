name: Deploy site-renderer only

on:
  workflow_dispatch: {}   # run manually only
  # if you ALSO want it on push to pristine.04, uncomment below
  # push:
  #   branches:
  #     - pristine.04

env:
  # this is your personal/new team
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID_SITE }}     # <-- use the secrets for the PERSONAL team
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_SITE }}       # <-- personal/new team token

jobs:
  site:
    name: Build + (optionally) deploy site-renderer
    runs-on: ubuntu-latest
    env:
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_SITE }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps (root)
        run: pnpm install --no-frozen-lockfile

      - name: Create .vercel directory and config
        working-directory: apps/site-renderer
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<'JSON'
          {
            "projectId": "${{ env.VERCEL_PROJECT_ID }}",
            "orgId": "${{ env.VERCEL_ORG_ID }}"
          }
          JSON

      - name: Build site-renderer
        run: pnpm turbo run build --filter=site-renderer

      # 👉 if you want CI to actually deploy to THAT team, keep this step.
      # if the team hits the 100/day limit, just comment this step out.
      - name: Deploy to Vercel (prebuilt)
        working-directory: apps/site-renderer
        run: npx vercel@latest deploy --prebuilt --prod --yes --token "${{ env.VERCEL_TOKEN }}"
