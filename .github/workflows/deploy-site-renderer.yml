name: Deploy site-renderer to personal account

on:
  push:
    branches:
      - pristine.04
  workflow_dispatch: {}

jobs:
  site-renderer:
    runs-on: ubuntu-latest
    env:
      # 🔐 personal team secrets (already set)
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID_SR }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_SITE }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_SR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # 🚫 Avoid running root preinstall/postinstall scripts that try to write /packages
      - name: Install deps (root; ignore scripts)
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      # 🏗️ Build only what we need (deps + site-renderer)
      - name: Build packages and app
        run: |
          pnpm turbo run build --filter='@weblynk/ui' --filter='@weblynk/blocks' --filter='@weblynk/templates'
          pnpm turbo run build --filter=site-renderer

      # 🧹 ensure we don't inherit any old project links
      - name: Remove any existing .vercel config
        run: |
          find . -name ".vercel" -type d -exec rm -rf {} + || true
          find . -name "vercel.json" -type f -delete || true

      # 🔗 write the correct project link for THIS app
      - name: Write .vercel/project.json (site-renderer)
        working-directory: apps/site-renderer
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<'JSON'
          {
            "orgId": "$VERCEL_ORG_ID",
            "projectId": "$VERCEL_PROJECT_ID"
          }
          JSON
          echo "Wrote .vercel/project.json:"
          cat .vercel/project.json

      # 🔧 Ensure shell & PATH are available to the Vercel builder
      - name: Ensure shell & PATH for vercel build
        run: |
          echo "SHELL=/bin/bash" >> $GITHUB_ENV
          echo "PATH=$PATH:/bin:/usr/bin" >> $GITHUB_ENV
          which sh || true
          ls -l /bin/sh || true

      # 🔑 pull prod envs into local file so vercel build can use them
      - name: Pull Vercel envs (production)
        run: |
          npx vercel@latest env pull apps/site-renderer/.env.production.local \
            --yes \
            --token "$VERCEL_TOKEN"

      # 🧱 produce the prebuilt artifact LOCALLY in CI: .vercel/output
      - name: Create prebuilt output (.vercel/output)
        run: |
          npx vercel@latest build \
            --cwd apps/site-renderer \
            --prod \
            --yes \
            --token "$VERCEL_TOKEN"

      # 🚀 deploy the prebuilt artifact (no server build on Vercel)
      - name: Deploy prebuilt to Vercel
        working-directory: apps/site-renderer
        run: |
          npx vercel@latest deploy \
            --prebuilt \
            --prod \
            --yes \
            --token "$VERCEL_TOKEN"
