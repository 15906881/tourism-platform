name: Deploy site-renderer (host-only, app-dir)

on:
  push:
    branches: [pristine.04]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID_SR }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_SITE }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_SR }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 10.4.0 }

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      - name: Build app (+internal packages)
        run: pnpm turbo run build --filter=site-renderer

      - name: Sanity check build output
        run: |
          test -f apps/site-renderer/.next/build-manifest.json
          test -d apps/site-renderer/.next/static

      - name: Link to the correct Vercel project (in app dir)
        working-directory: apps/site-renderer
        run: |
          rm -rf .vercel
          mkdir -p .vercel
          cat > .vercel/project.json <<EOF
          { "orgId": "${VERCEL_ORG_ID}", "projectId": "${VERCEL_PROJECT_ID}" }
          EOF

      - name: Deploy (no extra path, no --cwd, no --prebuilt)
        working-directory: apps/site-renderer
        run: |
          npx vercel@48.8.0 deploy \
            --prod \
            --yes \
            --scope cranadmin \
            --token "$VERCEL_TOKEN"
