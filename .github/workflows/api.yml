name: API

permissions:
  contents: read

on:
  workflow_dispatch: {}
  push:
    branches: [develop, main]
    paths: 
      - 'packages/server/**'
      - 'packages/db/**'
      - 'packages/auth/**'
      - '.github/workflows/api.yml'

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install pnpm
        run: npm install -g pnpm
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run API tests
        run: pnpm --filter server test || echo "No tests configured yet"
      
      - name: API smoke test
        run: echo "✅ API workflow updated for monorepo structure"
