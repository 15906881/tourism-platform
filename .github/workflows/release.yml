name: Create GitHub Release
on:
  push:
    tags:
      - "v*"
      - "release-*"
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
