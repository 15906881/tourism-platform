name: verify-apps
on:
  pull_request:
    branches: [develop]
  push:
    branches: [fe/**, fix/**, chore/**, ci/**]
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - name: Install API deps
        working-directory: api
        run: |
          npm ci || npm install
      - name: Smoke load server.js (no run)
        working-directory: api
        run: node -e "require('fs').accessSync('server.js'); console.log('server.js present ✅')"
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - name: Install Web deps
        working-directory: web
        run: |
          npm ci || npm install
      - name: Build Web
        working-directory: web
        run: npm run build
