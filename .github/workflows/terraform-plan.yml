name: Terraform Plan

permissions:
  contents: read
  pull-requests: write
  id-token: write

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'infra/**'
      - '.github/workflows/terraform-*.yml'

concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform-plan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: terraform-plan-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ~1.0

      - name: Terraform Format Check
        working-directory: infra/phase-2/environments/dev
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: infra/phase-2/environments/dev
        run: terraform init

      - name: Terraform Validate
        working-directory: infra/phase-2/environments/dev
        run: terraform validate

      - name: Terraform Plan
        working-directory: infra/phase-2/environments/dev
        run: terraform plan -detailed-exitcode -no-color -out=tfplan.out

      - name: Plan Status
        run: echo "Terraform plan completed"
