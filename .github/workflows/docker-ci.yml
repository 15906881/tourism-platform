name: docker-ci

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'api/**'
      - 'web/**'
      - 'docker-compose.yml'
      - '.github/workflows/docker-ci.yml'
  push:
    branches: [develop, main]
    paths:
      - 'api/**'
      - 'web/**'
      - 'docker-compose.yml'
      - '.github/workflows/docker-ci.yml'

concurrency:
  group: docker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.app }} (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.app }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Web needs the API base URL at build time
          build-args: |
            VITE_API_BASE_URL=http://localhost:8000
